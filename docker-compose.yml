version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marienbad
      POSTGRES_USER: marienbad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marienbad_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marienbad']
      interval: 5s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://marienbad:${POSTGRES_PASSWORD:-marienbad_dev_password}@postgres:5432/marienbad
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change-me-in-production-64-chars-minimum}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 3001
    ports:
      - '3001:3001'

volumes:
  postgres_data:
