name: Weekly Article Draft

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      topic_id:
        description: 'Topic ID from backlog (leave empty for auto-select)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — print output without writing files or creating PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install script dependencies
        run: npm install --prefix scripts

      - name: Generate and verify article draft
        id: generate
        run: node scripts/generate-weekly-article.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC_ID: ${{ inputs.topic_id }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

      - name: Commit article files
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          BRANCH="content/weekly-article-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/content/articles/
          TOPIC=$(cat /tmp/article-topic.txt)
          git commit -m "content: add weekly article draft

Topic: $TOPIC
Status: draft — requires editorial review before publishing

Generated by weekly-article workflow."
          git push -u origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Create Pull Request
        if: ${{ inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "$(cat /tmp/article-pr-title.txt)" \
            --body "$(cat /tmp/article-pr-body.txt)" \
            --base main \
            --head "$BRANCH" \
            --label "content" \
            --label "draft"
